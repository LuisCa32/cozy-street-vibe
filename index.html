<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07040d">
<meta name="description" content="A quiet autumn street at dusk — generative pixel art with falling leaves.">
<title>Autumn Street at Dusk</title>
<style>
  html, body { margin: 0; height: 100%; background: #07040d; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    height: 100vh; height: 100dvh;
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #d3bde6;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #view { display: block; image-rendering: crisp-edges; image-rendering: pixelated; touch-action: none; cursor: pointer; }
  .hidden, [hidden] { display: none !important; }

  /* Hidden control panel (toggle with H or the controls button) */
  #ui {
    position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); z-index: 2;
    min-width: 250px; padding: 10px 12px; box-sizing: border-box;
    max-width: calc(100vw - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
    background: rgba(15, 10, 28, 0.86); border: 1px solid #43286b; border-radius: 6px;
  }
  #ui .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  #ui label, #ui .slider-row { display: grid; grid-template-columns: 52px 1fr 36px; align-items: center; gap: 6px; margin: 6px 0; }
  #ui .slider-row { grid-template-columns: 52px 1fr auto; }
  #ui input[type=range] { width: 100%; min-width: 0; accent-color: #f0a23c; }
  #seedInput {
    flex: 1; min-width: 0; font: inherit; color: #ffd36b;
    background: #1c1233; border: 1px solid #5e3a87; border-radius: 4px; padding: 3px 6px;
  }
  #ui :focus-visible { outline: 2px solid #f0a23c; outline-offset: 1px; }
  #ui button {
    font: inherit; color: #d3bde6; background: #2c1b4d; border: 1px solid #5e3a87;
    border-radius: 4px; padding: 3px 8px; cursor: pointer;
  }
  #ui button:hover { background: #43286b; }
  #ui .hint { margin: 8px 0 0; color: #a582c4; font-size: 11px; }
  @media (pointer: coarse) { #hint { display: none; } }   /* keyboard shortcuts mean nothing on a phone */
  /* Controls button: always findable, dims (never vanishes) when nothing is happening */
  #uiToggle {
    position: fixed; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 2;
    width: 44px; height: 44px; padding: 0; display: grid; place-items: center; cursor: pointer;
    background: rgba(15, 10, 28, 0.78); border: 1px solid #5e3a87; border-radius: 10px;
    opacity: 0.9; transition: opacity 0.6s, border-color 0.2s, background 0.2s;
  }
  #uiToggle svg { display: block; width: 24px; height: 24px; }
  #uiToggle.idle { opacity: 0.4; }
  #uiToggle:hover, #uiToggle:focus-visible, #uiToggle[aria-expanded="true"] { opacity: 1; border-color: #a582c4; background: rgba(44, 27, 77, 0.9); }
  #uiToggle:focus-visible { outline: 2px solid #f0a23c; outline-offset: 2px; }
  #recBadge {
    position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); z-index: 2;
    padding: 3px 8px; border-radius: 4px; background: rgba(15, 10, 28, 0.86); color: #ff6b5a;
  }
  #toast {
    position: fixed; left: 50%; bottom: calc(68px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 2;
    width: max-content; max-width: calc(100vw - 32px); box-sizing: border-box; text-align: center;
    padding: 5px 10px; border-radius: 4px; background: rgba(15, 10, 28, 0.86);
    transition: opacity 0.6s; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="view" aria-label="Pixel-art autumn street at dusk with falling leaves"></canvas>

<div id="ui" class="hidden">
  <form id="seedForm" class="row" autocomplete="off">
    <span>seed</span>
    <input id="seedInput" type="text" spellcheck="false" maxlength="24" aria-label="Seed" title="A number or any word">
    <button type="submit">go</button>
    <button id="newSeedBtn" type="button" title="R">random</button>
  </form>
  <label>leaves <input id="leafSlider" type="range"> <span id="leafVal"></span></label>
  <label>wind <input id="windSlider" type="range" min="0" max="2.5" step="0.05"> <span id="windVal"></span></label>
  <div class="slider-row"><span>music</span><input id="volSlider" type="range" min="0" max="1" step="0.05" aria-label="Music volume"><button id="musicBtn" type="button" title="M" aria-pressed="false">off</button></div>
  <p class="hint" id="musicInfo"></p>
  <div class="row"><button id="gustBtn" title="tap / click">gust</button><button id="recBtn" title="V">record 12s</button></div>
  <p class="hint" id="hint">H hide · R random seed · M music · V record · click/tap = gust</p>
</div>
<button id="uiToggle" type="button" aria-label="Show controls" aria-expanded="false" aria-controls="ui" title="Controls (H)">
  <svg viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true">
    <path fill="#a582c4" d="M1 2h10v1H1zM1 6h10v1H1zM1 10h10v1H1z"/>
    <path fill="#f0a23c" d="M6 1h3v3H6zM2 5h3v3H2zM7 9h3v3H7z"/>
  </svg>
</button>
<div id="recBadge" class="hidden">● REC <span id="recTime">0.0</span>s</div>
<div id="toast" style="opacity:0"></div>

<script>
(() => {
'use strict';

/* ==========================================================================
 * CONFIG — the knobs worth tweaking
 * ======================================================================== */
const CONFIG = {
  // The whole piece uses these 16 colours. Every frame is snapped back onto
  // this palette (with ordered dithering) so glows and fog stay "pixel art".
  PALETTE: [
    '#0f0a1c', //  0 INK      silhouettes, trunks, deepest shadow
    '#1c1233', //  1 NIGHT    sky zenith, wet asphalt
    '#2c1b4d', //  2 DUSK
    '#43286b', //  3 VIOLET   near skyline
    '#5e3a87', //  4 IRIS     far skyline, pavement
    '#7d56a3', //  5 LILAC
    '#a582c4', //  6 LAVENDER
    '#d3bde6', //  7 MIST     fog, moon
    '#3a1f3f', //  8 PLUM     house walls, warm shadow
    '#7a3a5c', //  9 ROSE     horizon glow
    '#b85f6e', // 10 BLUSH    warm light fall-off
    '#a33b2c', // 11 RUST     leaves
    '#d9662b', // 12 ORANGE   leaves
    '#f0a23c', // 13 AMBER    leaves, lamp light
    '#ffd36b', // 14 GOLD     lit windows
    '#fff3c4', // 15 FLAME    lamp core
  ],
  LEAF_COLORS: [[11, 4], [12, 4], [13, 2], [14, 0.35]], // [palette index, weight]

  // Leaves
  LEAF_COUNT: 220,              // airborne leaves (slider range below)
  LEAF_COUNT_MIN: 50,
  LEAF_COUNT_MAX: 500,
  LEAF_FALL_SPEED: [8, 14],     // terminal fall speed, buffer px / s
  LEAF_SWAY_AMP: [4, 12],       // sideways sway velocity, px / s
  LEAF_SWAY_FREQ: [1.0, 2.4],   // sway angular speed, rad / s
  LEAF_FLIP_SPEED: [3, 9],      // tumble speed, rad / s
  PILE_LIFETIME: [14, 28],      // seconds a landed leaf stays before it is gone
  PILE_FADE: 5,                 // last N seconds of that life are a fade-out
  PILE_MAX: 900,                // hard cap; oldest leaves fade faster beyond it
  PILE_MAX_HEIGHT: 3,           // px a pile can build up in one spot

  // Wind (px / s in buffer space)
  WIND_BASE: 5,                 // steady breeze
  WIND_NOISE: 7,                // smooth noise-driven variation on top
  WIND_STRENGTH: 1,             // global multiplier (the "wind" slider)
  GUST_INTERVAL: [9, 14],       // seconds between automatic gusts
  GUST_DURATION: [2.2, 3.6],    // how long a gust lasts at any one spot
  GUST_STRENGTH: [32, 55],      // peak gust speed
  GUST_SPEED: 120,              // how fast the gust front sweeps across, px / s
  TREE_DETACH_RATE: 0.2,        // leaves / s per leaf cluster at full gust
  TREE_AMBIENT_RATE: 0.004,     // leaves / s per cluster in calm air
  PILE_LIFT_RATE: 0.35,         // landed leaves re-lifted / s at full gust

  // Cozy details
  WINDOW_LIT_SHARE: 0.62,       // share of windows lit; switching on/off keeps this balance
  SMOKE_PUFF_INTERVAL: [0.35, 0.6], // seconds between smoke puffs from each chimney
  SMOKE_LIFE: [4.5, 7],         // seconds a smoke puff lives
  CAT_INTERVAL: [20, 45],       // seconds between the cat's strolls along the sidewalk
  LAMP_FLICKER_INTERVAL: [35, 70], // seconds between brief street-lamp flickers

  // Scene
  TREE_COUNT: [2, 4],
  CAMERA_DRIFT: 4,              // px of slow side-to-side drift (shows parallax); 0 = static
  CAMERA_PERIOD: 45,            // seconds per drift cycle
  WINDOW_TOGGLE_RATE: 0.12,     // lights switched on or off / s across the whole street
  QUANTIZE: true,               // snap every frame to PALETTE
  DITHER: 26,                   // ordered-dither strength for blended pixels
  PREWARM_SECONDS: 25,          // simulate this long before the first frame (no visible start)

  // Music
  MUSIC_VOLUME: 0.7,            // starting volume (the panel slider changes it)
  MUSIC_TEMPO: [62, 78],        // beats per minute, picked by the seed

  // Recording
  RECORD_SECONDS: 12,
  RECORD_FPS: 60,
  RECORD_BITRATE: 80_000_000,   // asked for; the browser clamps to what it supports
  CAN_DOWNLOAD: true,           // false where the host blocks downloads (hides recording)

  // Buffer sizes chosen so the 1080-wide export is an exact integer upscale.
  FORMATS: {
    '1x1':  { w: 216, h: 216, outW: 1080, outH: 1080 }, // ×5
    '9x16': { w: 180, h: 320, outW: 1080, outH: 1920 }, // ×6
  },
};

// Named palette indices
const C = { INK: 0, NIGHT: 1, DUSK: 2, VIOLET: 3, IRIS: 4, LILAC: 5, LAVENDER: 6, MIST: 7,
            PLUM: 8, ROSE: 9, BLUSH: 10, RUST: 11, ORANGE: 12, AMBER: 13, GOLD: 14, FLAME: 15 };

// Leaf underside (tumbling away from us) and lamp-lit variants of each colour
const UNDER = CONFIG.PALETTE.map((_, i) => i);
UNDER[C.RUST] = C.PLUM; UNDER[C.ORANGE] = C.RUST; UNDER[C.AMBER] = C.ORANGE; UNDER[C.GOLD] = C.AMBER;
const LIT = CONFIG.PALETTE.map((_, i) => i);
LIT[C.PLUM] = C.ROSE; LIT[C.RUST] = C.ORANGE; LIT[C.ORANGE] = C.AMBER; LIT[C.AMBER] = C.GOLD; LIT[C.GOLD] = C.FLAME;

// Parallax factor per layer (1 = moves with the camera, 0 = fixed at infinity)
const PARALLAX = { skylineA: 0.1, skylineB: 0.22, houses: 0.45, fogFar: 0.3, fogLow: 1 };

/* ==========================================================================
 * Format, layout and small helpers
 * ======================================================================== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

const params = new URLSearchParams(location.search);
// The hash works too (e.g. #123, #9x16, #9x16-123) for hosts that strip the query string
const HASH = location.hash.slice(1).split('-').filter(Boolean);
const HASH_SEED = (() => {
  try { return decodeURIComponent(HASH.filter(h => !/^(9x16|1x1)$/i.test(h)).join('-')); } catch (_) { return ''; }
})();
const RATIO = /^9[x:]16$/i.test(params.get('ratio') || '') || HASH.some(h => /^9x16$/i.test(h)) ? '9x16' : '1x1';
const URL_SEED = params.get('seed') || HASH_SEED;
const FMT = CONFIG.FORMATS[RATIO];
const W = FMT.w, H = FMT.h;
const TALL = H > W;
const M = 8;                       // hidden margin each side of wide layers, so the camera can drift
const COLS = W + 2 * M;            // world columns covered by the leaf-pile height map
const BANDS = 10;                  // depth bands of the height map

const LAY = (() => {
  const sidewalkTop = Math.round(H * (TALL ? 0.72 : 0.73));
  return {
    sidewalkTop,                   // back edge of the sidewalk (houses stand here)
    curbTop: sidewalkTop + 10,     // front edge of the sidewalk
    streetTop: sidewalkTop + 13,   // gutter line; asphalt below
    horizon: sidewalkTop - 6,      // where the sky ramp ends
  };
})();
const GROUND_TOP = LAY.sidewalkTop + 2;   // landing row for the farthest leaves (z = 0)
const GROUND_BOT = H - 2;                 // landing row for the nearest leaves  (z = 1)
const CAT_Y = LAY.sidewalkTop + 4;        // row the cat's paws walk on (whole sprite on the pavement)
const FOG_LOW_H = 36;                     // height of the low street-fog band

const PAL = CONFIG.PALETTE;
const PR = new Uint8Array(16), PG = new Uint8Array(16), PB = new Uint8Array(16);
PAL.forEach((hex, i) => {
  const n = parseInt(hex.slice(1), 16);
  PR[i] = n >> 16; PG[i] = (n >> 8) & 255; PB[i] = n & 255;
});

// Palette packed as 32-bit RGBA words (little-endian, as every browser canvas is)
const PAL32 = new Uint32Array(16);
for (let i = 0; i < 16; i++) PAL32[i] = ((255 << 24) | (PB[i] << 16) | (PG[i] << 8) | PR[i]) >>> 0;

// 4×4 Bayer matrix: thresholds for the sky ramp and offsets for the quantizer
const BAYER4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const BAYER_T = BAYER4.map(v => (v + 0.5) / 16);
const BAYER_OFF = new Int8Array(BAYER4.map(v => Math.round(((v + 0.5) / 16 - 0.5) * CONFIG.DITHER)));

// 15-bit RGB → nearest palette index lookup table (weighted RGB distance)
const LUT = new Uint8Array(32768);
for (let r = 0; r < 32; r++) for (let g = 0; g < 32; g++) for (let b = 0; b < 32; b++) {
  const R = r * 8 + 4, G = g * 8 + 4, B = b * 8 + 4;
  let best = 0, bestD = Infinity;
  for (let i = 0; i < 16; i++) {
    const dr = R - PR[i], dg = G - PG[i], db = B - PB[i];
    const d = 2 * dr * dr + 4 * dg * dg + 3 * db * db;
    if (d < bestD) { bestD = d; best = i; }
  }
  LUT[(r << 10) | (g << 5) | b] = best;
}

/* ---------- seeded randomness ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashString(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
class Rand {
  constructor(seed) { this.next = mulberry32(seed); }
  f(a = 0, b = 1) { return a + (b - a) * this.next(); }
  i(a, b) { return Math.floor(this.f(a, b + 1)); }          // integer in [a, b]
  r(range) { return this.f(range[0], range[1]); }
  chance(p) { return this.next() < p; }
  pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
  weighted(list) {
    let sum = 0;
    for (const [, w] of list) sum += w;
    let r = this.next() * sum;
    for (const [v, w] of list) if ((r -= w) <= 0) return v;
    return list[list.length - 1][0];
  }
}
// Smooth 1-D value noise in roughly [-1, 1]
function makeNoise(rand) {
  const tbl = new Float32Array(256);
  for (let i = 0; i < 256; i++) tbl[i] = rand.f(-1, 1);
  return x => {
    const xf = Math.floor(x), f = x - xf, i = xf & 255, u = f * f * (3 - 2 * f);
    return tbl[i] + (tbl[(i + 1) & 255] - tbl[i]) * u;
  };
}

/* ---------- pixel drawing helpers (all coordinates are buffer pixels) ---------- */
function makeLayer(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return { c, g };
}
function rect(g, x, y, w, h, ci) { g.fillStyle = PAL[ci]; g.fillRect(Math.round(x), Math.round(y), w, h); }
function px(g, x, y, ci) { g.fillStyle = PAL[ci]; g.fillRect(Math.round(x), Math.round(y), 1, 1); }
// Bresenham line with a square brush of size `th`
function line(g, x0, y0, x1, y1, ci, th = 1) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  const o = Math.floor((th - 1) / 2);
  let err = dx + dy;
  g.fillStyle = PAL[ci];
  for (;;) {
    g.fillRect(x0 - o, y0 - o, th, th);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
function disc(g, cx, cy, r, ci) {
  g.fillStyle = PAL[ci];
  for (let dy = -r; dy <= r; dy++) {
    const half = Math.floor(Math.sqrt(r * r - dy * dy + r * 0.8));
    g.fillRect(cx - half, cy + dy, half * 2 + 1, 1);
  }
}

/* ==========================================================================
 * SCENE GENERATION — everything static is pre-rendered per seed
 * ======================================================================== */

// Sky: dithered purple → rose ramp (wide warm band at the horizon), a moon with a soft halo; stars are drawn live.
function buildSky(rng) {
  const { c, g } = makeLayer(W, H);
  const img = g.createImageData(W, H), d = img.data;
  const ramp = [C.NIGHT, C.DUSK, C.VIOLET, C.IRIS, C.ROSE, C.BLUSH];
  for (let y = 0; y < H; y++) {
    const te = Math.pow(clamp(y / LAY.horizon, 0, 1), 1.35) * (ramp.length - 1);
    const i0 = Math.min(Math.floor(te), ramp.length - 1), f = te - i0;
    for (let x = 0; x < W; x++) {
      const ci = f > BAYER_T[((y & 3) << 2) | (x & 3)] ? ramp[Math.min(i0 + 1, ramp.length - 1)] : ramp[i0];
      const k = (y * W + x) * 4;
      d[k] = PR[ci]; d[k + 1] = PG[ci]; d[k + 2] = PB[ci]; d[k + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);

  // Moon with a two-step halo (the quantizer turns the halo into dithering)
  const mr = rng.i(4, 6);
  const mx = Math.round(rng.f(0.15, 0.85) * W), my = Math.round(rng.f(0.12, 0.3) * LAY.horizon);
  g.globalAlpha = 0.12; disc(g, mx, my, mr + 8, C.LAVENDER);
  g.globalAlpha = 0.2;  disc(g, mx, my, mr + 3, C.LAVENDER);
  g.globalAlpha = 1;    disc(g, mx, my, mr, C.MIST);
  for (let k = 0; k < 3; k++) px(g, mx + rng.i(-mr + 2, mr - 2), my + rng.i(-mr + 2, mr - 2), C.LAVENDER);

  const stars = [];
  const count = Math.round(W * LAY.horizon / 1100);
  for (let k = 0; k < count; k++) {
    const x = rng.i(0, W - 1), y = rng.i(2, Math.round(LAY.horizon * 0.55));
    if (Math.hypot(x - mx, y - my) < mr + 6) continue;
    stars.push({ x, y, c: rng.chance(0.3) ? C.MIST : C.LAVENDER, f: rng.f(0.6, 2.4), ph: rng.f(0, TAU) });
  }
  return { canvas: c, stars };
}

// Distant skyline silhouettes (flat colour, a few dim windows)
function buildSkyline(rng, color, hRange, wRange, winColor, winChance) {
  const { c, g } = makeLayer(W + 2 * M, H);
  g.translate(M, 0);
  const base = LAY.sidewalkTop - 4, tall = TALL ? 1.5 : 1;
  let x = -M - rng.i(0, 6);
  while (x < W + M) {
    const bw = rng.i(wRange[0], wRange[1]);
    const bh = Math.round(rng.f(hRange[0], hRange[1]) * tall);
    const top = base - bh;
    rect(g, x, top, bw, bh + 12, color);
    const r = rng.next();
    if (r < 0.2 && bw > 6) rect(g, x + 2, top - 3, bw - 4, 3, color);              // stepped roof
    else if (r < 0.35) rect(g, x + rng.i(1, bw - 2), top - rng.i(4, 9), 1, 10, color); // antenna
    else if (r < 0.45 && bw > 7) {                                                  // water tower
      rect(g, x + 2, top - 6, 5, 3, color); rect(g, x + 2, top - 3, 1, 3, color); rect(g, x + 6, top - 3, 1, 3, color);
    }
    for (let wy = top + 3; wy < base - 2; wy += 4)
      for (let wx = x + 2; wx < x + bw - 1; wx += 3)
        if (rng.chance(winChance)) px(g, wx, wy, rng.chance(0.15) ? C.AMBER : winColor);
    x += bw + rng.i(-3, 2);
  }
  return c;
}

// Things glimpsed through lit windows: [chance, [[dx, dy, colour], …]] inside a 3×4 pane
const INTERIORS = [
  [0.12, [[0, 2, C.INK], [2, 2, C.INK], [0, 3, C.INK], [1, 3, C.INK], [2, 3, C.INK]]],          // cat on the sill
  [0.18, [[1, 1, C.PLUM], [0, 2, C.PLUM], [1, 2, C.PLUM], [2, 2, C.PLUM], [1, 3, C.RUST]]],      // potted plant
  [0.12, [[1, 0, C.FLAME], [0, 1, C.FLAME], [1, 1, C.FLAME], [2, 1, C.FLAME], [1, 2, C.PLUM], [1, 3, C.PLUM]]], // table lamp
  [0.08, [[1, 1, C.PLUM], [0, 2, C.PLUM], [1, 2, C.PLUM], [2, 2, C.PLUM],
          [0, 3, C.PLUM], [1, 3, C.PLUM], [2, 3, C.RUST]]],                                       // someone reading
];
function pickInterior(rng) {
  let r = rng.next();
  for (const [p, pixels] of INTERIORS) if ((r -= p) < 0) return pixels;
  return null;
}

// A framed 3×4 window; the pane itself is lit live by drawWindows()
function addWindow(g, rng, wx, wy, trim, ground, windows) {
  rect(g, wx - 1, wy - 1, 5, 6, C.INK);         // frame
  rect(g, wx, wy, 3, 4, C.NIGHT);               // dark pane
  rect(g, wx - 1, wy + 5, 5, 1, trim);          // sill
  const detail = pickInterior(rng);
  windows.push({ x: wx, y: wy, w: 3, h: 4, ground, lit: rng.chance(CONFIG.WINDOW_LIT_SHARE),
                 color: rng.weighted([[C.GOLD, 3], [C.AMBER, 2]]), detail,
                 curtain: !detail && rng.chance(0.35) });
}

// Jack-o'-lantern body (5×4, sitting on `base`), drawn live on top of its own glow
function drawPumpkin(g, x, base) {
  px(g, x + 2, base - 4, C.INK);                // stem
  rect(g, x + 1, base - 3, 3, 1, C.ORANGE);
  rect(g, x, base - 2, 5, 2, C.ORANGE);
  px(g, x, base - 1, C.RUST); px(g, x + 4, base - 1, C.RUST);
}

// Mid row of small gabled houses (plus one lit shopfront). Window panes, chimneys,
// porch lights and pumpkins are recorded so they can glow, smoke and flicker live.
function buildHouses(rng) {
  const { c, g } = makeLayer(W + 2 * M, H);
  g.translate(M, 0);
  const base = LAY.sidewalkTop;
  const windows = [], chimneys = [], porches = [], pumpkins = [];
  const shopAt = rng.f(0.15, 0.6) * W;
  let shopDone = false;
  let x = -M - rng.i(0, 12);
  while (x < W + M) {
    const shop = !shopDone && x >= shopAt;
    if (shop) shopDone = true;
    const hw = (shop ? rng.i(15, 18) : rng.i(10, 17)) * 2 + 1;   // odd width → crisp gable peak
    const half0 = (hw >> 1) + 1;                                  // roof half-width incl. 1px eave
    const wallH = shop ? rng.i(25, 28) : rng.i(15, 24);
    const roofH = Math.round(hw * (shop ? rng.f(0.3, 0.38) : rng.f(0.36, 0.5)));
    const wall = rng.weighted([[C.PLUM, 3], [C.DUSK, 2]]);
    const trim = wall === C.PLUM ? C.ROSE : C.VIOLET;
    const roof = rng.pick([C.INK, C.NIGHT]);
    const rim = roof === C.INK ? C.DUSK : C.VIOLET;              // roof edges catch the dusk sky
    const top = base - wallH, cx = x + (hw >> 1);

    // Chimney first, so the roof overlaps its foot; most of them have a fire going
    if (rng.chance(shop ? 0.85 : 0.6)) {
      const d = rng.i(3, Math.max(3, (hw >> 1) - 4));
      const chx = cx + (rng.chance(0.5) ? -d : d);
      const roofY = top - roofH + Math.max(0, Math.ceil(d * roofH / half0) - 1);
      const chTop = roofY - rng.i(3, 6);
      rect(g, chx - 1, chTop, 3, roofY - chTop + 2, C.INK);
      rect(g, chx - 2, chTop, 5, 1, C.INK);
      const every = rng.r(CONFIG.SMOKE_PUFF_INTERVAL);
      chimneys.push({ x: chx, y: chTop - 1, smoking: rng.chance(0.8), every, acc: rng.f(0, every) });
    }

    rect(g, x, top, hw, wallH, wall);
    rect(g, x, top, hw, 1, C.INK);                    // shadow under the eave
    for (let r = 0; r < roofH; r++) {                 // gable roof, one row at a time
      const half = Math.round((r + 1) / roofH * half0), y = top - roofH + r;
      rect(g, cx - half, y, half * 2 + 1, 1, roof);
      px(g, cx - half, y, rim); px(g, cx + half, y, rim);
    }

    // Attic window
    if (roofH >= 9 && rng.chance(0.5)) {
      const ay = top - Math.round(roofH * 0.5);
      rect(g, cx - 1, ay - 1, 3, 4, C.INK);
      rect(g, cx, ay, 1, 2, C.NIGHT);
      windows.push({ x: cx, y: ay, w: 1, h: 2, ground: false, lit: rng.chance(CONFIG.WINDOW_LIT_SHARE),
                     color: C.AMBER, detail: null, curtain: false });
    }

    if (shop) buildShopFront(rng, g, x, hw, top, base, trim, windows, porches);
    else {
      // A shrub hugging one corner (placed first so a pumpkin can keep clear of it)
      let shrub = null;
      if (rng.chance(0.6)) {
        const bw = rng.i(4, 7), bh = rng.i(2, 4);
        const bx = rng.chance(0.5) ? x - 1 : x + hw - bw + 1;
        shrub = [bx, bx + bw - 1];
        for (let i = 0; i < bw; i++) {
          const h = Math.max(1, Math.round(bh * Math.sin(Math.PI * (i + 0.5) / bw)));
          rect(g, bx + i, base - h, 1, h, C.INK);
        }
      }

      // Window grid with a door in one ground-floor slot
      const cols = hw >= 29 ? 3 : 2, rows = wallH >= 21 ? 2 : 1;
      const doorCol = rng.i(0, cols - 1);
      for (let col = 0; col < cols; col++) {
        const wx = x + Math.round((col + 1) * hw / (cols + 1)) - 1;
        for (let row = 0; row < rows; row++) {
          if (row === 0 && col === doorCol) {
            rect(g, wx, base - 7, 3, 7, C.INK);
            rect(g, wx - 1, base - 1, 5, 1, C.VIOLET);  // step
            px(g, wx + 2, base - 4, C.DUSK);             // knob
            if (rng.chance(0.55)) {                      // porch light over the door
              rect(g, wx, base - 10, 3, 1, C.INK);
              porches.push({ x: wx + 1, y: base - 9 });
            }
            if (pumpkins.length < 3 && rng.chance(0.35)) {
              // On this house's own front, clear of its shrub, and on screen (so the cap counts visible ones)
              const fits = v => v >= x && v + 4 <= x + hw - 2 && v >= 2 && v <= W - 7 &&
                                (!shrub || v + 4 < shrub[0] || v > shrub[1]);
              const a = rng.chance(0.5) ? wx + 4 : wx - 6, b = a === wx + 4 ? wx - 6 : wx + 4;
              const pkx = fits(a) ? a : fits(b) ? b : null;
              if (pkx !== null) pumpkins.push({ x: pkx, y: base, f: 1 });
            }
            continue;
          }
          addWindow(g, rng, wx, row === 0 ? base - 11 : top + 3, trim, row === 0, windows);
        }
      }
    }
    x += hw + rng.i(1, 5);
  }
  for (const w of windows) w.level = w.lit ? 1 : 0;
  return { canvas: c, windows, chimneys, porches, pumpkins };
}

// The street's one shopfront: a lit café or bookshop under a striped awning
function buildShopFront(rng, g, x, hw, top, base, trim, windows, porches) {
  for (let col = 0; col < 3; col++) addWindow(g, rng, x + Math.round((col + 1) * hw / 4) - 1, top + 3, trim, false, windows);

  const sx = x + 3, sw = hw - 11, sy = base - 11, sh = 6, dx = x + hw - 6;
  rect(g, sx - 1, sy - 1, sw + 2, sh + 2, C.INK);                    // window frame
  rect(g, sx - 1, sy + sh + 1, sw + 2, base - sy - sh - 1, C.INK);   // kick plate
  rect(g, sx - 1, sy + sh + 1, sw + 2, 1, trim);                     // sill
  rect(g, dx, base - 9, 3, 9, C.INK);                                // door
  rect(g, dx - 1, base - 1, 5, 1, C.VIOLET);                         // step
  rect(g, dx, base - 12, 3, 1, C.INK);                               // lamp over the door
  porches.push({ x: dx + 1, y: base - 11 });
  windows.push({ x: dx + 1, y: base - 8, w: 1, h: 3, ground: true, fixed: true, lit: true,
                 color: C.GOLD, detail: null, curtain: false });      // glass in the door

  // Striped awning with a scalloped edge
  for (let ax = sx - 2; ax <= sx + sw + 1; ax++) {
    const k = ax - sx + 2, stripe = (k >> 1) & 1 ? C.BLUSH : C.RUST;
    px(g, ax, base - 16, C.PLUM);
    rect(g, ax, base - 15, 1, 2, stripe);
    if (k % 2 === 0) px(g, ax, base - 13, stripe);
  }

  // What you see through the big window
  const detail = [];
  let color;
  if (rng.chance(0.5)) {                                             // café
    color = C.AMBER;
    for (let lx = 2 + rng.i(0, 2); lx < sw - 1; lx += rng.i(5, 7)) detail.push([lx, 0, C.PLUM], [lx, 1, C.FLAME]); // pendant lamps
    for (let tx = 1 + rng.i(0, 2); tx < sw - 3; tx += rng.i(6, 8)) {
      detail.push([tx, 4, C.PLUM], [tx + 1, 4, C.PLUM], [tx + 2, 4, C.PLUM], [tx + 1, 5, C.PLUM]);   // table
      if (rng.chance(0.5)) detail.push([tx + 1, 3, C.MIST]);                                       // a cup
      if (rng.chance(0.75)) {                                                                      // someone sitting
        const p = rng.chance(0.5) ? tx - 1 : tx + 3, d = p < tx ? -1 : 1;
        detail.push([p, 2, C.PLUM], [p, 3, C.PLUM], [p + d, 3, C.PLUM], [p, 4, C.PLUM], [p, 5, C.PLUM]);
      }
    }
  } else {                                                           // bookshop
    color = C.GOLD;
    const spines = [C.RUST, C.ORANGE, C.PLUM, C.ROSE, C.VIOLET, C.BLUSH];
    for (const shelf of [2, 5]) {
      for (let bx = 0; bx < sw; bx++) {
        detail.push([bx, shelf, C.PLUM]);
        if (rng.chance(0.65)) {
          const col = rng.pick(spines);
          detail.push([bx, shelf - 1, col]);
          if (rng.chance(0.45)) detail.push([bx, shelf - 2, col]);
        }
      }
    }
    if (rng.chance(0.7)) {                                           // someone browsing
      const p = rng.i(2, sw - 3);
      detail.push([p, 1, C.INK], [p, 2, C.INK], [p + 1, 2, C.INK], [p, 3, C.INK], [p + 1, 3, C.INK],
                  [p, 4, C.INK], [p, 5, C.INK], [p + 1, 5, C.INK]);
    }
  }
  windows.push({ x: sx, y: sy, w: sw, h: sh, ground: true, fixed: true, lit: true, color, curtain: false,
                 detail: detail.filter(([a, b]) => a >= 0 && a < sw && b >= 0 && b < sh) });
}

// Sidewalk, curb and wet street (static parts)
function buildGround(rng) {
  const { c, g } = makeLayer(W + 2 * M, H);
  g.translate(M, 0);
  const x0 = -M, ww = W + 2 * M, { sidewalkTop: st, curbTop: ct, streetTop: sTop } = LAY;

  // Sidewalk slabs
  rect(g, x0, st, ww, ct - st, C.IRIS);
  rect(g, x0, st, ww, 1, C.VIOLET);
  for (let x = x0 + rng.i(0, 11); x < W + M; x += 12) rect(g, x, st + 1, 1, ct - st - 1, C.VIOLET);
  for (let k = 0; k < ww * 0.4; k++) px(g, rng.i(x0, W + M), rng.i(st + 1, ct - 1), rng.chance(0.5) ? C.VIOLET : C.LILAC);

  // Curb
  rect(g, x0, ct, ww, 1, C.LILAC);
  rect(g, x0, ct + 1, ww, sTop - ct - 1, C.DUSK);

  // Asphalt
  rect(g, x0, sTop, ww, H - sTop, C.NIGHT);
  rect(g, x0, sTop, ww, 1, C.INK);                          // gutter
  for (let y = sTop + 1; y < sTop + 7; y++)                 // sky reflected near the curb
    for (let x = x0; x < W + M; x++)
      if (BAYER_T[((y & 3) << 2) | (x & 3)] < (1 - (y - sTop) / 7) * 0.55) px(g, x, y, C.DUSK);
  for (let k = 0; k < ww * (H - sTop) * 0.035; k++) px(g, rng.i(x0, W + M), rng.i(sTop + 1, H - 1), C.DUSK);
  for (let k = 0; k < ww * 0.12; k++) {                      // wet sheen streaks
    const y = rng.i(sTop + 2, H - 1);
    rect(g, rng.i(x0, W + M), y, rng.i(3, 12), 1, rng.chance(0.25) ? C.VIOLET : C.DUSK);
  }
  for (let k = 0; k < rng.i(2, 4); k++) {                    // puddles
    const pxx = rng.i(0, W), pyy = rng.i(sTop + 6, H - 4), rx = rng.i(5, 11);
    for (let dy = -1; dy <= 1; dy++) {
      const hw = Math.round(rx * Math.sqrt(1 - (dy * dy) / 2.5));
      rect(g, pxx - hw, pyy + dy, hw * 2 + 1, 1, dy < 0 ? C.VIOLET : C.DUSK);
    }
  }
  const laneY = sTop + Math.round((H - sTop) * 0.55);         // faded centre line
  for (let x = x0 + rng.i(0, 13); x < W + M; x += 14) rect(g, x, laneY, 7, 1, C.IRIS);
  return c;
}

// Park bench seen from the front; `by` is the row its feet stand on
function drawBench(g, bx, by) {
  rect(g, bx, by - 6, 9, 1, C.INK);             // top rail
  rect(g, bx, by - 4, 9, 1, C.INK);             // lower rail
  rect(g, bx + 1, by - 6, 1, 4, C.INK);         // back posts
  rect(g, bx + 7, by - 6, 1, 4, C.INK);
  rect(g, bx - 1, by - 3, 11, 1, C.PLUM);       // seat, warmed by the lamp
  rect(g, bx - 1, by - 2, 11, 1, C.INK);
  rect(g, bx, by - 1, 1, 2, C.INK);             // legs
  rect(g, bx + 8, by - 1, 1, 2, C.INK);
}

// Trees (recursive branches + leaf clusters), a bench and the street lamp
function buildFront(rng) {
  const { c, g } = makeLayer(W + 2 * M, H);
  g.translate(M, 0);
  const lampX = Math.round(rng.f(0.2, 0.8) * W);
  const benchX = rng.chance(0.5) ? lampX + 4 : lampX - 12;   // bench spans benchX-1 … benchX+9
  const clearL = Math.min(lampX, benchX) - 10, clearR = Math.max(lampX, benchX + 9) + 10;
  const trees = [], clusters = [];

  const count = rng.i(CONFIG.TREE_COUNT[0], CONFIG.TREE_COUNT[1]);
  for (let i = 0; i < count; i++) {
    let tx = Math.round((i + 0.5) / count * W + rng.f(-0.25, 0.25) * W / count);
    if (tx > clearL && tx < clearR) {
      // Keep the lamp and bench clear, moving to whichever edge leaves more room from the neighbours
      const prev = trees.length ? trees[trees.length - 1].x : -Infinity;
      const next = i + 1 < count ? (i + 1.5) / count * W : Infinity;
      const room = e => Math.min(e - prev, next - e);
      tx = room(clearL) >= room(clearR) ? clearL : clearR;
      if (room(tx) < 18 && trees.length + count - i - 1 >= 2) continue;   // too cramped: skip this tree
    }
    const baseY = LAY.sidewalkTop + rng.i(4, 6);
    const height = rng.f(TALL ? 0.26 : 0.3, TALL ? 0.36 : 0.42) * H;
    trees.push(buildTree(rng, g, tx, baseY, height, lampX, clusters));
  }

  drawBench(g, benchX, LAY.sidewalkTop + 6);

  // Lamp post (the glass is drawn live so it can flicker)
  const baseY = LAY.curbTop - 1, postH = Math.round(H * (TALL ? 0.17 : 0.2)), headY = baseY - postH;
  rect(g, lampX - 1, baseY - 3, 3, 4, C.INK);                    // foot
  rect(g, lampX, headY + 4, 1, postH - 4, C.INK);                // post
  rect(g, lampX - 1, baseY - Math.round(postH * 0.4), 3, 1, C.INK); // collar
  px(g, lampX, headY - 3, C.INK);                                // finial
  rect(g, lampX - 1, headY - 2, 3, 1, C.INK);                    // cap
  rect(g, lampX - 2, headY - 1, 5, 1, C.INK);                    // brim
  rect(g, lampX - 2, headY, 1, 3, C.INK); rect(g, lampX + 2, headY, 1, 3, C.INK); // frame
  rect(g, lampX - 1, headY + 3, 3, 1, C.INK);
  const lamp = { x: lampX, headY, baseY, glowR: TALL ? 34 : 30, poolR: TALL ? 46 : 40 };
  return { canvas: c, trees, clusters, lamp };
}

function buildTree(rng, g, tx, baseY, height, lampX, allClusters) {
  const clusters = [];
  const depthMax = rng.i(5, 6);
  const lit = lampX > tx ? 1 : -1;      // which side of the bark faces the lamp

  const addCluster = (cx, cy) => {
    const pixels = [];
    for (let k = rng.i(3, 8); k > 0; k--) {
      const dx = Math.round(rng.f(-2.6, 2.6)), dy = Math.round(rng.f(-2, 1.6));
      const base = rng.weighted(CONFIG.LEAF_COLORS);
      pixels.push([dx, dy, dy >= 1 && rng.chance(0.5) ? UNDER[base] : base, base]);
    }
    clusters.push({ x: Math.round(cx), y: Math.round(cy), px: pixels, group: rng.i(0, 1) });
  };

  // Recursive branching: each branch splits into 2–3 shorter, thinner children
  const grow = (x, y, ang, len, d, th) => {
    const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
    line(g, x, y, x2, y2, C.INK, th);
    if (th >= 2) {                      // warm rim light on the lamp side of thick limbs
      const o = Math.floor((th - 1) / 2), hx = lit > 0 ? th - 1 - o : -o;
      line(g, x + hx, y, x2 + hx, y2, C.PLUM, 1);
    }
    if (d === 0 || len < 2.5) { if (rng.chance(0.7)) addCluster(x2, y2); return; }
    if (d <= 2 && rng.chance(0.3)) addCluster(x2, y2);
    const n = d >= depthMax - 1 ? 2 : rng.chance(0.3) ? 3 : 2;
    const spread = rng.f(0.3, 0.6);
    for (let i = 0; i < n; i++) {
      if (d <= 2 && rng.chance(0.12)) continue;          // missing twigs keep it bare-ish
      let a = ang + (i / (n - 1) * 2 - 1) * spread + rng.f(-0.18, 0.18);
      a += (-Math.PI / 2 - a) * 0.12;                    // gentle upward bias
      grow(x2, y2, a, len * rng.f(0.64, 0.8), d - 1, Math.max(1, th - 1));
    }
  };

  rect(g, tx - 3, baseY, 7, 2, C.NIGHT);                 // tree pit
  rect(g, tx - 2, baseY - 1, 5, 2, C.INK);               // root flare
  grow(tx, baseY, -Math.PI / 2 + rng.f(-0.12, 0.12), height * rng.f(0.3, 0.36), depthMax, 3);

  // Foliage goes on two small canvases that rustle independently in the wind
  let minX = tx, maxX = tx, minY = baseY, maxY = baseY;
  for (const cl of clusters) {
    minX = Math.min(minX, cl.x); maxX = Math.max(maxX, cl.x);
    minY = Math.min(minY, cl.y); maxY = Math.max(maxY, cl.y);
  }
  const bx = minX - 4, by = minY - 4, bw = maxX - minX + 9, bh = maxY - minY + 9;
  const fol = [makeLayer(bw, bh), makeLayer(bw, bh)];
  for (const cl of clusters) {
    const fg = fol[cl.group].g;
    for (const [dx, dy, ci] of cl.px) px(fg, cl.x + dx - bx, cl.y + dy - by, ci);
    allClusters.push(cl);
  }
  return { x: tx, topY: minY, bx, by, fol: fol.map(f => f.c), ph: rng.f(0, TAU) };
}

// Horizontally tileable fog strip built from periodic value noise
function buildFogStrip(rng, tw, th, maxA) {
  const { c, g } = makeLayer(tw, th);
  const img = g.createImageData(tw, th), d = img.data;
  const grid = (gx, gy) => {
    const v = new Float32Array(gx * (gy + 1)).map(() => rng.next());
    return (u, w) => {
      const X = u * gx, Y = w * gy, xi = Math.floor(X), yi = Math.floor(Y);
      const fx = X - xi, fy = Y - yi, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
      const x0 = xi % gx, x1 = (xi + 1) % gx, y1 = Math.min(yi + 1, gy);
      const a = v[yi * gx + x0], b = v[yi * gx + x1], cc = v[y1 * gx + x0], dd = v[y1 * gx + x1];
      return (a + (b - a) * sx) * (1 - sy) + (cc + (dd - cc) * sx) * sy;
    };
  };
  const n1 = grid(Math.round(tw / 26), 3), n2 = grid(Math.round(tw / 11), 6);
  for (let y = 0; y < th; y++) {
    const profile = Math.pow(Math.sin(Math.PI * (y + 0.5) / th), 1.4);
    for (let x = 0; x < tw; x++) {
      const n = 0.65 * n1(x / tw, y / th) + 0.35 * n2(x / tw, y / th);
      const a = clamp((n - 0.3) / 0.45, 0, 1) * profile * maxA;
      const k = (y * tw + x) * 4;
      d[k] = PR[C.MIST]; d[k + 1] = PG[C.MIST]; d[k + 2] = PB[C.MIST]; d[k + 3] = a * 255;
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}

function buildVignette() {
  const { c, g } = makeLayer(W, H);
  const r0 = Math.min(W, H) * 0.6, r1 = Math.hypot(W, H) * 0.6;
  const gr = g.createRadialGradient(W / 2, H * 0.45, r0, W / 2, H * 0.45, r1);
  gr.addColorStop(0, 'rgba(15,10,28,0)');
  gr.addColorStop(1, 'rgba(15,10,28,0.28)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  return c;
}

function buildScene(seedNum) {
  const rng = new Rand(seedNum);
  const sky = buildSky(rng);
  const houses = buildHouses(rng);
  const S = {
    sky: sky.canvas, stars: sky.stars,
    skylineA: buildSkyline(rng, C.IRIS, [30, 66], [8, 20], C.ROSE, 0.03),
    skylineB: buildSkyline(rng, C.VIOLET, [20, 46], [6, 16], C.BLUSH, 0.05),
    houses: houses.canvas, windows: houses.windows, chimneys: houses.chimneys,
    porches: houses.porches, pumpkins: houses.pumpkins,
    ground: buildGround(rng),
  };
  const front = buildFront(rng);
  Object.assign(S, { front: front.canvas, trees: front.trees, clusters: front.clusters, lamp: front.lamp });
  S.toggleable = S.windows.filter(w => !w.fixed);
  // No pumpkin hidden behind a trunk or the lamp post, no smoke that seems to come out of the lamp
  S.pumpkins = S.pumpkins.filter(pk =>
    S.trees.every(tr => Math.abs(tr.x - (pk.x + 2)) >= 7) && Math.abs(S.lamp.x - (pk.x + 2)) >= 5);
  for (const ch of S.chimneys) if (Math.abs(ch.x - S.lamp.x) < 6) ch.smoking = false;
  // Spots where the cat can sit without vanishing behind a trunk, the bench or the lamp post
  const fa = front.canvas.getContext('2d').getImageData(0, CAT_Y - 4, W + 2 * M, 5).data;
  S.catSpots = [];
  for (let sx = Math.ceil(0.2 * W); sx <= 0.8 * W; sx++) {
    let covered = 0, eyeRow = false;
    for (let r = 0; r < 5; r++) for (let c = -4; c < 4; c++) {
      if (fa[(r * (W + 2 * M) + sx + c + M) * 4 + 3] > 0) { covered++; if (r === 1) eyeRow = true; }
    }
    if (covered < 6 && !eyeRow) S.catSpots.push(sx);
  }
  S.fogFar = buildFogStrip(rng, W * 2, 28, 0.3);
  S.fogLow = buildFogStrip(rng, W * 2, FOG_LOW_H, 0.28);
  S.vignette = buildVignette();
  S.windDir = rng.chance(0.5) ? 1 : -1;
  S.noise = makeNoise(rng);
  return S;
}

/* ==========================================================================
 * SIMULATION STATE
 * ======================================================================== */
let S = null;                 // current scene
let rt = null;                // runtime PRNG (also seeded, so a seed replays the same motion)
let seedText = '';
let simT = 0;
let leaves = [], pile = [], gusts = [], puffs = [];
const heights = new Float32Array(BANDS * COLS);   // soft pile height per depth band × column
let nextGustAt = 0, nextFlickerAt = 0, flickerEnd = 0;
let prewarming = false;          // true while setSeed fast-forwards the simulation (no sounds)
let fogFarX = 0, fogLowX = 0;
let targetLeaves = CONFIG.LEAF_COUNT;
let windStrength = CONFIG.WIND_STRENGTH;
const GUST_REF = CONFIG.GUST_STRENGTH[1];
const cat = { state: 'away', timer: 0, x: 0, dir: 1, step: 0, tail: 0, sitAt: null };

const camX = t => Math.min(CONFIG.CAMERA_DRIFT, M - 1) * Math.sin(t * TAU / CONFIG.CAMERA_PERIOD);
const depthFactor = z => 0.45 + 0.55 * z;   // far leaves move less on screen (and parallax less)

/* ---------- wind ---------- */
function ambientWind(x, y, t) {
  const n = S.noise(t * 0.11 + x * 0.006 + y * 0.003) + 0.4 * S.noise(t * 0.43 + x * 0.021 + 91.7);
  return (S.windDir * CONFIG.WIND_BASE + n * CONFIG.WIND_NOISE) * windStrength;
}
// Gusts are fronts that sweep from the upwind edge across the street
function gustAt(x, t) {
  let s = 0;
  for (const gu of gusts) {
    const dist = gu.dir > 0 ? x + M + 30 : W + M + 30 - x;
    const tau = t - gu.t0 - dist / gu.speed;
    if (tau > 0 && tau < gu.dur) { const e = Math.sin(Math.PI * tau / gu.dur); s += gu.dir * gu.str * e * e; }
  }
  return s * windStrength;
}
const windAt = (x, y, t) => ambientWind(x, y, t) + gustAt(x, t);

function startGust(t, mul = 1, dir = 0) {
  const gu = {
    t0: t, dir: dir || (rt.chance(0.82) ? S.windDir : -S.windDir),
    dur: rt.r(CONFIG.GUST_DURATION), str: rt.r(CONFIG.GUST_STRENGTH) * mul,
    speed: CONFIG.GUST_SPEED * rt.f(0.8, 1.2),
  };
  gusts.push(gu);
  music.event('gust', gu);
}

function lampIntensity(t) {
  let I = 0.94 + 0.04 * S.noise(t * 1.7 + 300);
  if (t < flickerEnd) I *= Math.sin(t * 53) + Math.sin(t * 31.7 + 1) > 0.1 ? 1 : 0.65;
  return I;
}

/* ---------- leaves ---------- */
function makeLeaf() {
  return { x: 0, y: 0, vx: 0, vy: 0, z: 0, size: 1, color: C.ORANGE, phase: 0, swayAmp: 0,
           swayFreq: 0, fall: 0, flip: 0, flipSpeed: 0, lift: 0, landY: 0, band: 0 };
}
function initLeaf(p, x, y, z, color) {
  let s = z < 0.33 ? 1 : z < 0.72 ? 2 : 3;
  if (rt.chance(0.2)) s += rt.chance(0.5) ? 1 : -1;
  p.z = z; p.size = clamp(s, 1, 3);
  p.color = color ?? rt.weighted(CONFIG.LEAF_COLORS);
  p.x = x; p.y = y;
  p.fall = rt.r(CONFIG.LEAF_FALL_SPEED);
  p.vx = 0; p.vy = p.fall * 0.5;
  p.phase = rt.f(0, TAU);
  p.swayAmp = rt.r(CONFIG.LEAF_SWAY_AMP);
  p.swayFreq = rt.r(CONFIG.LEAF_SWAY_FREQ);
  p.flip = rt.f(0, TAU);
  p.flipSpeed = rt.r(CONFIG.LEAF_FLIP_SPEED);
  p.lift = rt.f(0.3, 1);
  p.band = Math.min(BANDS - 1, Math.floor(z * BANDS));
  p.landY = GROUND_TOP + z * (GROUND_BOT - GROUND_TOP);
  return p;
}
// A recycled leaf re-enters from the top, or from the upwind edge when it is breezy
function respawn(p, t) {
  const w = windAt(W * 0.5, H * 0.4, t);
  let x, y;
  if (Math.abs(w) > 0.6 * (CONFIG.WIND_BASE + CONFIG.WIND_NOISE) * windStrength && rt.chance(0.5)) {
    x = w > 0 ? -M - 6 : W + M + 6; y = rt.f(-10, LAY.sidewalkTop * 0.75);
  } else {
    x = clamp(rt.f(-M - 10, W + M + 10) - w * 2, -M - 10, W + M + 10); y = rt.f(-24, -3);
  }
  initLeaf(p, x, y, rt.next());
  p.vx = w * 0.8;
}
function recycle(i, t) {
  if (leaves.length > targetLeaves) { leaves[i] = leaves[leaves.length - 1]; leaves.pop(); }
  else respawn(leaves[i], t);
}
function bumpHeight(band, col, amt) {
  const base = band * COLS;
  for (let d = -1; d <= 1; d++) {
    const c = col + d;
    if (c < 0 || c >= COLS) continue;
    heights[base + c] = clamp(heights[base + c] + amt * (d === 0 ? 1 : 0.5), 0, CONFIG.PILE_MAX_HEIGHT);
  }
}
// Landed leaf → pile entry (re-anchored to the ground layer so there is no jump)
function settleLeaf(p, cam) {
  const x = p.x - cam * depthFactor(p.z) + cam;
  const col = Math.round(x) + M;
  if (col < 0 || col >= COLS) return;
  const life = rt.r(CONFIG.PILE_LIFETIME);
  pile.push({ x, y: Math.round(p.landY - heights[p.band * COLS + col]), z: p.z, band: p.band, col,
              w: p.size, h: p.size === 3 ? 2 : 1, color: p.color, life, max: life, mob: rt.f(0.3, 1) });
  bumpHeight(p.band, col, 0.3);
}
function spawnLeafAt(screenWorldX, y, z, color, cam) {
  const p = initLeaf(makeLeaf(), screenWorldX - cam + cam * depthFactor(z), y, z, color);
  leaves.push(p);
  return p;
}

function updateLeaves(dt, t, cam) {
  for (let i = leaves.length - 1; i >= 0; i--) {
    const p = leaves[i];
    const df = depthFactor(p.z);
    const gs = gustAt(p.x, t);
    const w = ambientWind(p.x, p.y, t) + gs;
    const gn = Math.min(1.3, Math.abs(gs) / GUST_REF);

    // Horizontal: relax toward the local wind (small leaves respond faster)
    p.vx += (w - p.vx) * Math.min(1, dt * (1.2 + (3 - p.size) * 0.6));
    // Vertical: gravity to terminal speed; gusts give buoyant leaves some lift
    p.vy += (p.fall * (1 - gn * 1.5 * p.lift) - p.vy) * Math.min(1, dt * 1.6);
    // Pendulum sway: sideways swing plus a little bob at each end of the swing
    const ph = p.phase + t * p.swayFreq;
    p.x += (p.vx + Math.cos(ph) * p.swayAmp) * df * dt;
    p.y += (p.vy + Math.sin(2 * ph) * p.swayAmp * 0.35) * df * dt;
    p.flip += dt * (p.flipSpeed + Math.abs(p.vx) * 0.12);
    if (p.y < -30) { p.y = -30; if (p.vy < 0) p.vy = 0; }

    const col = Math.round(p.x - cam * df + cam) + M;
    const land = p.landY - (col >= 0 && col < COLS ? heights[p.band * COLS + col] : 0);
    if (p.y >= land) { settleLeaf(p, cam); recycle(i, t); }
    else if (p.x < -M - 14 || p.x > W + M + 14) recycle(i, t);
  }
}

function updatePile(dt, t, cam) {
  const over = pile.length - CONFIG.PILE_MAX;
  const cap = targetLeaves * 1.6;
  let j = 0;
  for (let i = 0; i < pile.length; i++) {
    const e = pile[i];
    if (i < over) e.life = Math.min(e.life, 2);      // overflow: oldest leaves fade out quickly
    e.life -= dt;
    if (gusts.length && e.life > 0) {
      const gs = gustAt(e.x, t), gn = Math.abs(gs) / GUST_REF;
      if (gn > 0.25) {
        e.x += gs * 0.1 * e.mob * dt;                  // skitter along the ground
        if (leaves.length < cap && rt.chance(CONFIG.PILE_LIFT_RATE * gn * e.mob * dt)) {
          const p = spawnLeafAt(e.x, e.y - 1, e.z, e.color, cam);
          p.vy = -rt.f(12, 30); p.vx = gs * 0.6;
          e.life = 0;
        }
      }
    }
    if (e.life <= 0) { bumpHeight(e.band, e.col, -0.3); continue; }
    pile[j++] = e;
  }
  pile.length = j;
}

// Leaves let go of the trees now and then, and in bursts when a gust passes
function updateTrees(dt, t, cam) {
  const cap = targetLeaves * 1.6, cl = S.clusters;
  if (!cl.length || leaves.length >= cap) return;
  const detach = c => {
    const [dx, dy, , base] = rt.pick(c.px);
    const p = spawnLeafAt(c.x + dx, c.y + dy, rt.f(0.3, 0.95), base, cam);
    p.vx = windAt(c.x, c.y, t) * 0.5; p.vy = rt.f(-4, 6);
  };
  if (rt.chance(cl.length * CONFIG.TREE_AMBIENT_RATE * dt)) detach(rt.pick(cl));
  if (!gusts.length) return;
  for (const c of cl) {
    const gn = Math.abs(gustAt(c.x, t)) / GUST_REF;
    if (gn > 0.2 && rt.chance(CONFIG.TREE_DETACH_RATE * gn * dt)) {
      detach(c);
      if (leaves.length >= cap) return;
    }
  }
}

function update(dt, t) {
  const cam = camX(t);

  if (t >= nextGustAt) { startGust(t); nextGustAt = t + rt.r(CONFIG.GUST_INTERVAL); }
  gusts = gusts.filter(gu => t < gu.t0 + gu.dur + (W + 2 * M + 60) / gu.speed);

  if (t >= nextFlickerAt) {
    flickerEnd = t + rt.f(0.2, 0.45); nextFlickerAt = t + rt.r(CONFIG.LAMP_FLICKER_INTERVAL);
    music.event('flicker', { dur: flickerEnd - t });
  }

  // Windows: rarely someone switches a light on or off
  if (S.toggleable.length && rt.chance(CONFIG.WINDOW_TOGGLE_RATE * dt)) {
    const lit = S.toggleable.filter(w => w.lit).length / S.toggleable.length;
    const on = lit < CONFIG.WINDOW_LIT_SHARE;                    // drift back toward the lit share
    const pick = S.toggleable.filter(w => w.lit !== on);
    if (pick.length) {
      const w = rt.pick(pick);
      w.lit = on;
      music.event('window', { on, x: w.x / W });
    }
  }
  for (const w of S.windows) w.level = w.lit ? Math.min(1, w.level + dt * 2.5) : Math.max(0, w.level - dt * 0.8);

  const wc = windAt(W / 2, LAY.horizon, t);
  fogFarX += (S.windDir * 2 + wc * 0.12) * dt;
  fogLowX += (S.windDir * 3.5 + wc * 0.25) * dt;

  updateLeaves(dt, t, cam);
  updatePile(dt, t, cam);
  updateTrees(dt, t, cam);
  updateSmoke(dt, t);
  updateCat(dt, t);
}

/* ---------- chimney smoke ---------- */
function updateSmoke(dt, t) {
  for (const ch of S.chimneys) {
    if (!ch.smoking) continue;
    ch.acc += dt;
    while (ch.acc >= ch.every) {
      ch.acc -= ch.every;
      puffs.push({ x: ch.x + rt.f(-0.4, 0.4), y: ch.y, age: 0, life: rt.r(CONFIG.SMOKE_LIFE),
                   ph: rt.f(0, TAU), size: rt.f(0.8, 1.2) });
    }
  }
  let j = 0;
  for (const p of puffs) {
    p.age += dt;
    if (p.age >= p.life || p.x < -M - 12 || p.x > W + M + 12) continue;
    // Rises and slows, leans with the wind, wavers a little
    p.x += (windAt(p.x, p.y, t) * 0.3 + Math.sin(p.age * 1.4 + p.ph) * 1.2) * dt;
    p.y -= (4.5 - 2.5 * p.age / p.life) * dt;
    puffs[j++] = p;
  }
  puffs.length = j;
}

/* ---------- the neighbourhood cat ---------- */
// 8×5 sprites facing right ('#' fur, 'e' eye); mirrored when walking left
const CAT_SPRITES = {
  walkA: ['#....#.#', '#....#e#', '.######.', '.#####..', '.#...#..'],
  walkB: ['#....#.#', '#....#e#', '.######.', '.#####..', '..#.#...'],
  sit:   ['....#.#.', '....#e#.', '....###.', '#..####.', '.######.'],
  sitB:  ['....#.#.', '....#e#.', '#...###.', '#..####.', '.######.'],   // tail flick
};
function updateCat(dt, t) {
  const gn = Math.min(1, Math.abs(gustAt(cat.x, t)) / GUST_REF);
  if (cat.state === 'away') {
    if ((cat.timer -= dt) > 0) return;
    cat.state = 'walk';
    cat.dir = rt.chance(0.5) ? 1 : -1;
    cat.x = cat.dir > 0 ? -M - 10 : W + M + 10;
    cat.sitAt = rt.chance(0.6) && S.catSpots.length ? rt.pick(S.catSpots) : null;
    music.event('catWalk', { dir: cat.dir });
  } else if (cat.state === 'sit') {
    cat.tail += dt;
    if ((cat.timer -= dt) <= 0 || gn > 0.6) cat.state = 'walk';     // a strong gust gets it moving
  } else {
    const speed = gn > 0.5 ? 20 : 8;                                 // trots in a gust
    cat.x += cat.dir * speed * dt;
    cat.step += speed * dt;
    if (cat.sitAt !== null && (cat.dir > 0 ? cat.x >= cat.sitAt : cat.x <= cat.sitAt)) {
      cat.state = 'sit'; cat.timer = rt.f(3, 7); cat.tail = 0; cat.sitAt = null;
      music.event('catSit', {});
    }
    if (cat.x < -M - 12 || cat.x > W + M + 12) { cat.state = 'away'; cat.timer = rt.r(CONFIG.CAT_INTERVAL); }
  }
}

/* ==========================================================================
 * RENDERING (into the small buffer)
 * ======================================================================== */
const buf = document.createElement('canvas');
buf.width = W; buf.height = H;
const bctx = buf.getContext('2d', { willReadFrequently: true });
bctx.imageSmoothingEnabled = false;

const fogTmp = makeLayer(W, FOG_LOW_H);     // scratch canvas for tinting the low fog

// Soft radial light. Each (radius, colour) is rendered once and then stamped with
// globalAlpha, which is far cheaper than building a gradient per light per frame.
const glowSprites = new Map();
function glow(g, x, y, r, rgb, a) {
  const key = r + '|' + rgb;
  let spr = glowSprites.get(key);
  if (!spr) {
    const { c, g: sg } = makeLayer(r * 2, r * 2);
    const gr = sg.createRadialGradient(r, r, 0, r, r, r);
    gr.addColorStop(0, `rgba(${rgb},1)`);
    gr.addColorStop(1, `rgba(${rgb},0)`);
    sg.fillStyle = gr; sg.fillRect(0, 0, r * 2, r * 2);
    glowSprites.set(key, spr = c);
  }
  g.globalAlpha = a;
  g.drawImage(spr, Math.round(x - r), Math.round(y - r));
  g.globalAlpha = 1;
}

function drawFog(g, strip, offset, y, alpha) {
  const tw = strip.width;
  const x = -Math.round(((offset % tw) + tw) % tw);
  g.globalAlpha = alpha;
  g.drawImage(strip, x, y); g.drawImage(strip, x + tw, y);
  g.globalAlpha = 1;
}

function drawWindows(g, hx) {
  for (const w of S.windows) {
    if (w.level < 0.02) continue;
    const x = w.x - hx;
    if (x < -6 || x > W + 6) continue;
    g.globalAlpha = w.level * 0.22;                     // soft spill (dithered by the quantizer)
    g.fillStyle = PAL[C.AMBER]; g.fillRect(x - 2, w.y - 2, w.w + 4, w.h + 4);
    g.globalAlpha = w.level;
    g.fillStyle = PAL[w.color]; g.fillRect(x, w.y, w.w, w.h);
    if (w.detail) {                                     // cat, plant, lamp, reader, café, books…
      for (const [dx, dy, ci] of w.detail) { g.fillStyle = PAL[ci]; g.fillRect(x + dx, w.y + dy, 1, 1); }
    } else if (w.w === 3) {
      g.fillStyle = PAL[C.AMBER]; g.fillRect(x, w.y + 2, 3, 1);        // mullion
      if (w.curtain) { g.fillStyle = PAL[C.ORANGE]; g.fillRect(x, w.y, 1, w.h); }
    }
  }
  g.globalAlpha = 1;
}

// Windows, porch lights and candle-lit jack-o'-lanterns (drawn after the ground so
// their glow reaches the sidewalk too). The glows go down first; the fixtures and
// pumpkins are drawn over them so the light doesn't wash them out.
function drawHouseLights(g, t, hx) {
  drawWindows(g, hx);
  g.globalCompositeOperation = 'lighter';
  for (const p of S.porches) {
    const x = p.x - hx;
    if (x > -8 && x < W + 8) glow(g, x + 0.5, p.y + 0.5, 4, '255,160,70', 0.55);
  }
  for (const p of S.pumpkins) {
    p.f = 0.75 + 0.25 * S.noise(t * 5 + p.x * 0.37);         // candle flicker
    const x = p.x - hx;
    if (x > -10 && x < W + 10) glow(g, x + 2.5, p.y, 7, '255,150,60', 0.3 * p.f);
  }
  g.globalCompositeOperation = 'source-over';
  for (const p of S.porches) {
    const x = p.x - hx;
    rect(g, x - 1, p.y - 1, 3, 1, C.INK);                       // fixture hood
    rect(g, x - 1, p.y + 2, 3, 1, C.INK);                       // top of the door
    px(g, x, p.y, C.GOLD);
  }
  for (const p of S.pumpkins) {
    const x = p.x - hx;
    drawPumpkin(g, x, p.y);
    g.fillStyle = PAL[p.f > 0.88 ? C.FLAME : p.f > 0.65 ? C.GOLD : C.AMBER];
    g.fillRect(x + 1, p.y - 2, 1, 1); g.fillRect(x + 3, p.y - 2, 1, 1); g.fillRect(x + 2, p.y - 1, 1, 1);
  }
}

function drawSmoke(g, hx) {
  g.fillStyle = PAL[C.MIST];
  for (const p of puffs) {
    const k = p.age / p.life;
    const a = 0.42 * Math.min(1, p.age * 2.5) * Math.pow(1 - k, 1.3);
    if (a < 0.02) continue;
    g.globalAlpha = a;
    g.beginPath();
    g.arc(p.x - hx, p.y, (0.8 + k * 3.2) * p.size, 0, TAU);
    g.fill();
  }
  g.globalAlpha = 1;
}

function drawCat(g, camR) {
  if (cat.state === 'away') return;
  const spr = cat.state === 'sit'
    ? CAT_SPRITES[Math.floor(cat.tail * 1.5) % 4 === 3 ? 'sitB' : 'sit']
    : CAT_SPRITES[Math.floor(cat.step / 2.5) % 2 ? 'walkB' : 'walkA'];
  const x0 = Math.round(cat.x) - camR - 4, y0 = CAT_Y - spr.length + 1;
  for (let r = 0; r < spr.length; r++) {
    for (let c = 0; c < 8; c++) {
      const ch = spr[r][c];
      if (ch === '.') continue;
      g.fillStyle = PAL[ch === 'e' ? C.AMBER : C.INK];
      g.fillRect(x0 + (cat.dir > 0 ? c : 7 - c), y0 + r, 1, 1);
    }
  }
}

// Low fog, warmed where the lamp, lit windows and porch lights shine into it
function drawWarmFog(g, t, I, cam, camR, hx) {
  const ft = fogTmp.g, fy = LAY.sidewalkTop - 14;
  ft.globalCompositeOperation = 'source-over';
  ft.clearRect(0, 0, W, FOG_LOW_H);
  drawFog(ft, S.fogLow, fogLowX + cam * PARALLAX.fogLow, 0, 0.8 + 0.2 * Math.sin(t * 0.17 + 1));
  ft.globalCompositeOperation = 'source-atop';                     // tint only where there is fog
  glow(ft, S.lamp.x - camR + 0.5, S.lamp.headY + 1.5 - fy, 46, '240,150,60', 0.75 * I);
  for (const w of S.windows) {
    if (!w.ground || w.level < 0.05) continue;
    const x = w.x - hx + w.w / 2;
    if (x > -20 && x < W + 20) glow(ft, x, w.y + w.h / 2 - fy, 8 + w.w, '255,190,100', 0.5 * w.level);
  }
  for (const p of S.porches) {
    const x = p.x - hx;
    if (x > -12 && x < W + 12) glow(ft, x + 0.5, p.y - fy, 10, '255,190,100', 0.45);
  }
  ft.globalCompositeOperation = 'source-over';
  g.drawImage(fogTmp.c, 0, fy);
}

// Lamp and window light reflected on the wet street
function drawReflections(g, t, I, camR, hx) {
  const top = LAY.streetTop + 1, span = H - top, lx = S.lamp.x - camR;
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = PAL[C.AMBER];
  for (let y = top; y < H; y++) {
    const k = (y - top) / span;
    const rip = Math.sin(y * 1.9 - t * 2.4) + 0.7 * Math.sin(y * 0.71 + t * 1.3 + 1.7);
    if (rip < -0.4) continue;
    const half = 1 + Math.round(k * 2.5 + (rip > 0.9 ? 1 : 0));
    g.globalAlpha = I * (0.45 - 0.25 * k) * (rip > 0.5 ? 1 : 0.55);
    g.fillRect(lx - half, y, half * 2 + 1, 1);
  }
  g.fillStyle = PAL[C.GOLD];
  for (const w of S.windows) {
    if (w.level < 0.3) continue;
    const n = Math.max(1, Math.round(w.w / 3));
    for (let i = 0; i < n; i++) {
      const x = w.x - hx + Math.floor((i + 0.5) * w.w / n);
      if (x < 0 || x >= W) continue;
      for (let k = 0; k < 7; k++) {
        if ((k + i + Math.floor(t * 1.5 + w.x)) % 3 === 0) continue;
        g.globalAlpha = w.level * 0.16 * (1 - k / 7);
        g.fillRect(x, top + 1 + k * 2, 1, 1);
      }
    }
  }

  // Warm light spilling from ground-floor windows and porch lights onto the sidewalk.
  // Painted over the pavement rather than added: additive amber on lilac stone stays lilac.
  const st = LAY.sidewalkTop;
  g.globalCompositeOperation = 'source-over';
  g.fillStyle = PAL[C.AMBER];
  for (const w of S.windows) {
    if (!w.ground || w.level < 0.05) continue;
    const x = w.x - hx;
    if (x + w.w < -8 || x > W + 8) continue;
    for (let k = 0; k < 6; k++) {
      const ext = Math.round(k * 0.7);
      g.globalAlpha = w.level * 0.35 * (1 - k / 6);
      g.fillRect(x - ext, st + 1 + k, w.w + ext * 2, 1);
    }
  }
  for (const p of S.porches) {
    const x = p.x - hx;
    for (let k = 0; k < 4; k++) {
      g.globalAlpha = 0.3 * (1 - k / 4);
      g.fillRect(x - 1 - k, st + 1 + k, 3 + 2 * k, 1);
    }

  g.globalAlpha = 1;

}

function drawPile(g, camR, I) {
  const L = S.lamp, lx = L.x - camR, r2 = (L.poolR * 0.75 * I) ** 2;
  for (const e of pile) {
    const x = Math.round(e.x) - camR;
    if (x < -3 || x > W) continue;
    let col = e.life < e.max * 0.5 ? UNDER[e.color] : e.color;   // leaves darken as they decay
    const dx = x - lx, dy = (e.y - L.baseY) * 3;
    if (dx * dx + dy * dy < r2) col = LIT[col];
    g.globalAlpha = Math.min(1, e.life / CONFIG.PILE_FADE);
    g.fillStyle = PAL[col];
    g.fillRect(x, e.y, e.w, e.h);
  }
  g.globalAlpha = 1;
}

function drawLeaves(g, cam, I, front) {
  const L = S.lamp, lx = L.x - cam, ly = L.headY + 1, r2 = (L.glowR * 0.7 * I) ** 2;
  for (const p of leaves) {
    if ((p.z >= 0.5) !== front) continue;
    const sx = Math.round(p.x - cam * depthFactor(p.z)), sy = Math.round(p.y);
    if (sx < -3 || sx > W + 2 || sy < -3) continue;
    const c = Math.cos(p.flip);
    let col = c < 0 ? UNDER[p.color] : p.color;            // tumbling: show the darker underside
    const dx = sx - lx, dy = sy - ly;
    if (dx * dx + dy * dy < r2) col = LIT[col];            // caught in the lamplight
    // Fake rotation: width shrinks as the leaf turns edge-on
    const w = p.size === 1 ? 1 : Math.max(1, Math.round(p.size * Math.abs(c)));
    const h = p.size === 3 ? 2 : 1;
    g.fillStyle = PAL[col];
    g.fillRect(sx - (w >> 1), sy, w, h);

function drawFoliage(g, t, camR) {
  for (const tr of S.trees) {
    const w = windAt(tr.x, tr.topY, t);
    const gn = Math.min(1, Math.abs(gustAt(tr.x, t)) / GUST_REF);
    for (let k = 0; k < 2; k++) {
      const sway = w / 45 + Math.sin(t * (4.5 + k * 2.1) + tr.ph + k) * (0.25 + gn * 0.9);
      g.drawImage(tr.fol[k], tr.bx - camR + Math.round(clamp(sway, -1, 1)), tr.by);
    }

}

function drawLamp(g, I, camR) {
  const L = S.lamp, x = L.x - camR;
  g.fillStyle = PAL[I > 0.7 ? C.FLAME : I > 0.45 ? C.GOLD : C.AMBER];
  g.fillRect(x - 1, L.headY, 3, 3);

  g.globalCompositeOperation = 'lighter';
  const cx = x + 0.5, cy = L.headY + 1.5, R = L.glowR;
  let gr = g.createRadialGradient(cx, cy, 0, cx, cy, R);
  gr.addColorStop(0, `rgba(255,236,180,${0.85 * I})`);
  gr.addColorStop(0.1, `rgba(255,190,100,${0.5 * I})`);
  gr.addColorStop(0.4, `rgba(240,140,60,${0.2 * I})`);
  gr.addColorStop(1, 'rgba(240,140,60,0)');
  g.fillStyle = gr; g.fillRect(cx - R, cy - R, R * 2, R * 2);

  const P = L.poolR;
  g.save();

  gr = g.createRadialGradient(0, 0, 0, 0, 0, P);
  gr.addColorStop(0, `rgba(255,190,100,${0.42 * I})`);
  gr.addColorStop(1, 'rgba(255,170,80,0)');
  g.fillStyle = gr; g.fillRect(-P, -P, P * 2, P * 2);
  g.restore();
  g.globalCompositeOperation = 'source-over';
}

// Snap every pixel to the palette; blended pixels get 4×4 ordered dithering.
// Works on whole 32-bit pixels: this loop is the hottest code in the piece.
function quantize() {
  const img = bctx.getImageData(0, 0, W, H), d = new Uint32Array(img.data.buffer);
  for (let y = 0, i = 0; y < H; y++) {
    const row = (y & 3) << 2;
    for (let x = 0; x < W; x++, i++) {
      const v = d[i], r = v & 255, g = (v >>> 8) & 255, b = (v >>> 16) & 255;
      if (PAL32[LUT[((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3)]] === v) continue;   // already a palette colour
      const o = BAYER_OFF[row | (x & 3)];
      let r2 = r + o, g2 = g + o, b2 = b + o;
      r2 = r2 < 0 ? 0 : r2 > 255 ? 255 : r2;
      g2 = g2 < 0 ? 0 : g2 > 255 ? 255 : g2;
      b2 = b2 < 0 ? 0 : b2 > 255 ? 255 : b2;
      d[i] = PAL32[LUT[((r2 >> 3) << 10) | ((g2 >> 3) << 5) | (b2 >> 3)]];
    }

  bctx.putImageData(img, 0, 0);
}

function render(t) {
  const g = bctx, cam = camX(t), camR = Math.round(cam), I = lampIntensity(t);
  const layerX = f => -M - Math.round(cam * f);
  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = 1;

  // Sky (at infinity) and twinkling stars
  g.drawImage(S.sky, 0, 0);
  for (const s of S.stars) {
    const v = Math.sin(t * s.f + s.ph);
    if (v > -0.5) { g.fillStyle = PAL[v > 0.8 ? C.MIST : s.c]; g.fillRect(s.x, s.y, 1, 1); }
  }

  // Far → near
  g.drawImage(S.skylineA, layerX(PARALLAX.skylineA), 0);
  g.drawImage(S.skylineB, layerX(PARALLAX.skylineB), 0);
  drawFog(g, S.fogFar, fogFarX + cam * PARALLAX.fogFar, LAY.horizon - 26, 0.85 + 0.15 * Math.sin(t * 0.23));
  const hx = Math.round(cam * PARALLAX.houses);
  g.drawImage(S.houses, -M - hx, 0);
  drawSmoke(g, hx);
  g.drawImage(S.ground, -M - camR, 0);
  drawHouseLights(g, t, hx);
  drawReflections(g, t, I, camR, hx);
  drawPile(g, camR, I);
  drawCat(g, camR);
  drawLeaves(g, cam, I, false);                      // leaves behind the trees
  g.drawImage(S.front, -M - camR, 0);
  drawFoliage(g, t, camR);
  drawLamp(g, I, camR);
  drawWarmFog(g, t, I, cam, camR, hx);
  drawLeaves(g, cam, I, true);                       // leaves in front
  g.drawImage(S.vignette, 0, 0);

  if (CONFIG.QUANTIZE) quantize();
}

 * BUILD / RESEED

function setSeed(text) {

  S = buildScene(num);
  music.setSeed(num);
  rt = new Rand((num ^ 0xA5A5A5A5) >>> 0);

  // Reset the simulation, scatter leaves through the air, then pre-warm so the
  // first visible frame already has drifting leaves, piles and a gust history.
  simT = 0; gusts = []; pile = []; heights.fill(0);
  nextGustAt = rt.r(CONFIG.GUST_INTERVAL); nextFlickerAt = rt.r(CONFIG.LAMP_FLICKER_INTERVAL) * 0.5; flickerEnd = 0;
  puffs = []; fogFarX = 0; fogLowX = 0;
  cat.state = 'away'; cat.timer = rt.f(3, 10); cat.sitAt = null; cat.step = 0; cat.tail = 0;
  leaves = [];

    p.y = rt.f(-20, p.landY - 1);

  let url;

  } else {

    if (RATIO === '9x16') q.set('ratio', '9x16'); else q.delete('ratio');
    url = `${location.pathname}?${q}`;

  try { history.replaceState(null, '', url); } catch (_) { /* sandboxed host */ }

}

/* ==========================================================================
 * PRESENTATION: letterboxed, crisp upscale to the screen

const view = document.getElementById('view');

function resize() {

  let s = Math.min(aw / W, ah / H);

/* ==========================================================================
 * RECORDING (V): 12 s nearest-neighbour upscaled clip via MediaRecorder
 * ======================================================================== */

  if (rec) return;

  if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) {
    toast('Recording is not supported in this browser'); return;
  }
  const rc = document.createElement('canvas');
  rc.width = FMT.outW; rc.height = FMT.outH;

  const video = rc.captureStream(CONFIG.RECORD_FPS);
  const audio = music.running && music.recDest ? music.recDest.stream.getAudioTracks() : [];   // what you hear
  const stream = new MediaStream([...video.getVideoTracks(), ...audio]);
  const types = audio.length

    : ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4;codecs=avc1', 'video/mp4'];
  const mimeType = types.find(tp => MediaRecorder.isTypeSupported(tp)) || '';
  let mr;

  } catch (err) {
    toast('Could not start recording: ' + err.message); return;
  }
  const chunks = [];
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = async () => {
    video.getTracks().forEach(tr => tr.stop());            // the music's audio track stays alive for next time
    const type = mr.mimeType || mimeType || 'video/webm';
    let blob = new Blob(chunks, { type });
    if (type.includes('webm')) {
      const parts = withWebmDuration(await blob.arrayBuffer(), rec.duration || CONFIG.RECORD_SECONDS * 1000);
      if (parts) blob = new Blob(parts, { type });
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `autumn-street-${seedText}-${RATIO}.${type.includes('mp4') ? 'mp4' : 'webm'}`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    toast('Saved ' + a.download);
    rec = null;
    if (music.ctx && !music.running) music.ctx.suspend();   // muted during the recording: sleep now
    ui.recBadge.classList.add('hidden');
    ui.recBtn.disabled = false;
  };
  mr.start(250);

  ui.recBadge.classList.remove('hidden');
  ui.recBtn.disabled = true;
}
// MediaRecorder writes WebM without a duration, so many players can't show its length or
// seek. Insert Segment ▸ Info ▸ Duration. Returns Blob parts, or null to keep the file as is.
function withWebmDuration(bytes, ms) {
  const b = new Uint8Array(bytes);

    let len = 1, m = 0x80;

    return [unknown ? -1 : v, len];

    if (v >= 2 ** (7 * len) - 1) return null;
    const out = new Uint8Array(len);
    for (let k = len - 1; k >= 0; k--) { out[k] = v % 256; v = Math.floor(v / 256); }
    out[0] |= 0x80 >> (len - 1);
    return out;

    const [ebml, el] = id(0), [ebmlSize, esl] = size(el);
    if (ebml !== 0x1A45DFA3) return null;
    const segAt = el + esl + ebmlSize, [seg, sl] = id(segAt), [segSize, ssl] = size(segAt + sl);
    if (seg !== 0x18538067) return null;
    for (let i = segAt + sl + ssl; i < b.length;) {
      const [eid, eidl] = id(i), [esz, eszl] = size(i + eidl);
      if (eid === 0x114D9B74 || esz < 0) return null;            // a SeekHead's offsets would go stale
      if (eid !== 0x1549A966) { i += eidl + eszl + esz; continue; }

      for (let j = body; j < end;) {

        if (cid === 0x4489) return null;                         // already has a duration
        if (cid === 0x2AD7B1) { scale = 0; for (let k = 0; k < cs; k++) scale = scale * 256 + b[j + cl + csl + k]; }
        j += cl + csl + cs;

    }
  } catch (_) { /* unexpected layout: keep the original file */ }
  return null;
}

function recordFrame(now) {
