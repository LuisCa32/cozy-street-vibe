// bars a little ahead of time, and hears the street through music.event().
// iPhone / iPad silent switch. Safari plays Web Audio in the "ambient" audio session, which the
// Ring/Silent switch mutes. While the music is on, ask for the "playback" session music apps use:
//   - iOS 16.4+: navigator.audioSession.type = 'playback'
//   - older iOS (or a frame that ignores it): a looping, inaudible <audio>, which makes WebKit pick
//     the same session. Generated here as a WAV, so the page still ships no audio files.
// Released when the music is muted or the page is hidden. Nothing changes on other platforms.
// Like any music app, starting the music pauses other audio (Music, Spotify, podcasts).
const silentSwitch = (() => {
  const ua = navigator.userAgent;
  // iPadOS reports a Mac user agent; WebKit gives maxTouchPoints 5 on iOS and 0 on macOS
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 0);
  const session = isIOS && 'audioSession' in navigator ? navigator.audioSession : null;
  let viaSession = false, wanted = false, el = null, wavRate = 0, wavURI = '';

  function setType(type) {
    if (!session) return false;
    try { session.type = type; } catch (_) { return false; }
    return session.type === type;               // a frame without microphone permission ignores the setter
  }
  // 0.5 s of 8-bit mono silence at the context's own rate (a file at another rate can change the
  // context's rate); under 0.95 s it stays out of Now Playing on iOS 17.2+
  function silentWav(rate) {
    if (rate === wavRate) return wavURI;
    const n = Math.round(rate / 2), len = 44 + n + (n & 1), b = new Uint8Array(len), v = new DataView(b.buffer);
    const tag = (o, x) => { for (let i = 0; i < 4; i++) b[o + i] = x.charCodeAt(i); };
    tag(0, 'RIFF'); v.setUint32(4, len - 8, true); tag(8, 'WAVE'); tag(12, 'fmt '); v.setUint32(16, 16, true);
    v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate, true);
    v.setUint16(32, 1, true); v.setUint16(34, 8, true); tag(36, 'data'); v.setUint32(40, n, true);
    b.fill(0x80, 44, 44 + n);                   // 8-bit silence is 0x80
    let str = '';
    for (let i = 0; i < len; i += 0x8000) str += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
    wavRate = rate;
    return (wavURI = 'data:audio/wav;base64,' + btoa(str));
  }
  function dropEl() {
    if (!el) return;
    const e = el; el = null;
    e.pause(); e.src = 'about:blank'; e.load();
  }
  return {
    // In the tap or key handler that turns the music on, before the context starts
    claim() { wanted = true; viaSession = setType('playback'); },
    // Older iOS only; play() needs a tap or key press, so this is safe to call on every one
    fallback(ctx) {
      if (!isIOS || viaSession || !wanted || !ctx) return;
      if (!el) {
        el = document.createElement('audio');
        el.setAttribute('x-webkit-airplay', 'deny');
        try { el.disableRemotePlayback = true; } catch (_) { /* older WebKit */ }
        el.preload = 'auto'; el.loop = true; el.src = silentWav(ctx.sampleRate); el.load();
      }
      el.muted = false;                         // a muted element does not count as playback
      if (!el.paused) return;
      const mine = el, pr = mine.play();
      if (pr && pr.catch) pr.catch(() => { if (el === mine && mine.paused) dropEl(); });   // retried on the next tap
    },
    // Music muted or page hidden: back to the default session, which obeys the switch again
    release() {
      wanted = false;
      if (session) setType('auto');
      viaSession = false;
      if (el) { el.pause(); el.muted = true; }  // pausing alone is not enough for WebKit
    },
  };
})();

const MUSIC_PREFS = 'autumn-street-music';
const music = {
  ctx: null, band: null, recDest: null, P: null, comp: null,
  running: false, wanted: true, volume: CONFIG.MUSIC_VOLUME, nextBarAt: 0, greeted: false,
  load() {
    try {
      const p = JSON.parse(localStorage.getItem(MUSIC_PREFS) || 'null');
      if (p) { this.wanted = p.wanted !== false; if (typeof p.volume === 'number') this.volume = clamp(p.volume, 0, 1); }
    } catch (_) { /* storage unavailable: defaults */ }
  },
  save() { try { localStorage.setItem(MUSIC_PREFS, JSON.stringify({ wanted: this.wanted, volume: this.volume })); } catch (_) { /* fine */ } },
  setSeed(num) {
    this.P = makeTune(num);
    ui.musicInfo.textContent = '♪ ' + tuneLabel(this.P);
    if (this.band) this.restart();
  },
  start() {
    silentSwitch.claim();                       // iOS: play even with the silent switch on
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { silentSwitch.release(); this.wanted = false; toast('This browser cannot play the music'); return; }
      this.ctx = new AC();
      const out = this.ctx.createGain();
      out.connect(this.ctx.destination);
      if (this.ctx.createMediaStreamDestination) { this.recDest = this.ctx.createMediaStreamDestination(); out.connect(this.recDest); }
      this.band = new Band(this.ctx, out);
      this.restart();
      setInterval(() => this.tick(), 100);
      if ('mediaSession' in navigator && window.MediaMetadata) {   // the title iOS shows in Now Playing
        try { navigator.mediaSession.metadata = new MediaMetadata({ title: 'Cozy Street Vibe' }); } catch (_) { /* fine */ }
      }
    }
    silentSwitch.fallback(this.ctx);
    this.resume();
    this.running = this.wanted = true;
    this.band.master.gain.setTargetAtTime(this.volume, this.ctx.currentTime, 0.3);
    this.save(); this.show();
    if (!this.greeted) {
      this.greeted = true;
      toast(`♪ ${tuneLabel(this.P)} · ${matchMedia('(pointer: coarse)').matches ? 'mute it in the controls' : 'M to mute'}`);
    }
  },
  resume() { const pr = this.ctx.resume(); if (pr && pr.catch) pr.catch(() => {}); },
  stop() {
    this.running = this.wanted = false;
    if (this.ctx) {
      this.band.master.gain.setTargetAtTime(0, this.ctx.currentTime, 0.08);
      setTimeout(() => {
        if (this.running) return;
        if (!rec) this.ctx.suspend();           // a recording keeps its (silent) track
        silentSwitch.release();                 // hand the audio back, so other apps can play again
      }, 400);
    }
    this.save(); this.show();
  },
  toggle() { if (this.running) this.stop(); else this.start(); },
  restart() {
    this.band.newTune(this.P);
    this.comp = makeComposer(this.P);
    this.nextBarAt = this.ctx.currentTime + 0.25;
    this.tick();
  },
  tick() {
    if (!this.running || this.ctx.state !== 'running') return;
    const now = this.ctx.currentTime, bar = 4 * 60 / this.P.bpm;
    if (this.nextBarAt < now) this.nextBarAt = now + 0.05;     // the page was asleep: carry on from here
    try {
      while (this.nextBarAt < now + 1.5) { this.band.playBar(this.comp.nextBar(), this.nextBarAt); this.nextBarAt += bar; }
    } catch (err) { console.warn('music', err); this.nextBarAt = now + bar; }   // never let audio break the picture
  },
  setVolume(v) {
    this.volume = v;
    if (this.running) this.band.master.gain.setTargetAtTime(v, this.ctx.currentTime, 0.05);
    this.save();
  },
  event(type, data) {
    try {
      if (this.running && !prewarming && this.ctx.state === 'running') this.band.accent(type, data, this.ctx.currentTime + 0.03);
    } catch (err) { console.warn('music accent', err); }
  },
  show() { ui.musicBtn.textContent = this.running ? 'on' : 'off'; ui.musicBtn.setAttribute('aria-pressed', String(this.running)); },
};
document.addEventListener('visibilitychange', () => {   // fade out when the tab hides, back in when it returns
  if (!music.ctx || !music.running) return;
  const g = music.band.master.gain, n = music.ctx.currentTime;
  if (document.hidden) {
    g.cancelScheduledValues(n); g.setTargetAtTime(0, n, 0.03);
    setTimeout(() => {
      if (!document.hidden || !music.running) return;
      if (!rec) music.ctx.suspend();
      silentSwitch.release();
    }, 200);
  } else {
    silentSwitch.claim();
    silentSwitch.fallback(music.ctx);           // older iOS may need the next tap for this
    const pr = music.ctx.resume();
    Promise.resolve(pr).then(() => {
      const n2 = music.ctx.currentTime;
      g.cancelScheduledValues(n2); g.setValueAtTime(0, n2); g.setTargetAtTime(music.volume, n2, 0.1);
    }).catch(() => {});
  }
});

/* ==========================================================================
 * UI & INPUT
 * ======================================================================== */
const $ = id => document.getElementById(id);
const ui = {
  panel: $('ui'), seedInput: $('seedInput'), leafSlider: $('leafSlider'), leafVal: $('leafVal'),
  windSlider: $('windSlider'), windVal: $('windVal'), recBtn: $('recBtn'), recBadge: $('recBadge'),
  recTime: $('recTime'), toast: $('toast'), uiToggle: $('uiToggle'), musicBtn: $('musicBtn'), volSlider: $('volSlider'), musicInfo: $('musicInfo'),
};
let toastTimer = 0;
function toast(msg, ms = 3000) {
  ui.toast.textContent = msg; ui.toast.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { ui.toast.style.opacity = 0; }, ms);
}
function toggleUI() {
  const open = !ui.panel.classList.toggle('hidden');
  ui.uiToggle.setAttribute('aria-expanded', String(open));
  ui.uiToggle.setAttribute('aria-label', open ? 'Hide controls' : 'Show controls');
  wakeToggle();
}
// The controls button dims after a few quiet seconds and brightens on any touch, mouse move or key
let idleTimer = 0;
function wakeToggle() {
  ui.uiToggle.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (ui.panel.classList.contains('hidden')) ui.uiToggle.classList.add('idle'); }, 4000);
}
for (const n of ['pointermove', 'pointerdown', 'keydown']) window.addEventListener(n, wakeToggle, { passive: true });

function triggerGust(dir = 0) {
  startGust(simT, 1.2, dir);
  nextGustAt = Math.max(nextGustAt, simT + 5);
}

ui.leafSlider.min = CONFIG.LEAF_COUNT_MIN; ui.leafSlider.max = CONFIG.LEAF_COUNT_MAX; ui.leafSlider.step = 10;
ui.leafSlider.value = targetLeaves; ui.leafVal.textContent = targetLeaves;
ui.leafSlider.addEventListener('input', () => {
  targetLeaves = Number(ui.leafSlider.value);
  ui.leafVal.textContent = targetLeaves;
  // New leaves start above the frame so they drift in; surplus ones retire as they land
  while (leaves.length < targetLeaves) {
    const p = makeLeaf(); respawn(p, simT); p.y = rt.f(-H * 0.6, -3); leaves.push(p);
  }
});
ui.windSlider.value = windStrength; ui.windVal.textContent = windStrength.toFixed(2);
ui.windSlider.addEventListener('input', () => {
  windStrength = Number(ui.windSlider.value);
  ui.windVal.textContent = windStrength.toFixed(2);
});
$('newSeedBtn').addEventListener('click', () => setSeed(randomSeed()));
// Type a seed (number or any word) and press Enter / go to rebuild that street
$('seedForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = ui.seedInput.value.trim();
  if (!v) { toast('Enter a seed: a number or any word'); return; }
  setSeed(v);
  ui.seedInput.blur();
  toast('Street rebuilt from seed ' + v);
});
$('gustBtn').addEventListener('click', () => triggerGust());
ui.recBtn.addEventListener('click', startRecording);
ui.recBtn.hidden = !CONFIG.CAN_DOWNLOAD;
ui.uiToggle.addEventListener('click', toggleUI);
music.load();
ui.volSlider.value = music.volume;
ui.volSlider.addEventListener('input', () => music.setVolume(Number(ui.volSlider.value)));
ui.musicBtn.addEventListener('click', () => music.toggle());
// Browsers only allow sound after the viewer interacts: the first tap or key starts the music
const firstGesture = e => {
  if (!music.wanted || (e.target.closest && e.target.closest('#musicBtn'))) return;
  if (!music.running) { music.start(); return; }
  silentSwitch.fallback(music.ctx);             // older iOS: (re)start the inaudible loop from this tap
  if (music.ctx && music.ctx.state !== 'running' && !document.hidden) music.resume();   // e.g. a touch that didn't count
};
for (const n of ['pointerdown', 'pointerup', 'touchend', 'click']) window.addEventListener(n, firstGesture, true);

// Tap / click anywhere outside the controls: a gust blowing away from the tap
window.addEventListener('pointerdown', e => {
  if (e.target.closest('#ui, #uiToggle')) return;
  triggerGust(e.clientX < window.innerWidth / 2 ? 1 : -1);
});
window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.matches && e.target.matches('input[type=text]')) return;   // typing a seed
  const k = e.key.toLowerCase();
  if (k === ' ' && e.target.closest && e.target.closest('button, input')) return;   // Space presses buttons
  if (k === 'm') { music.toggle(); return; }
  firstGesture(e);
  if (k === 'h') toggleUI();
  else if (k === 'r') setSeed(randomSeed());
  else if (k === 'v') startRecording();
  else if (k === 'g' || k === ' ') { triggerGust(); e.preventDefault(); }
});

/* ==========================================================================
 * MAIN LOOP
 * ======================================================================== */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  simT += dt;
  update(dt, simT);
  render(simT);
  vctx.drawImage(buf, 0, 0, view.width, view.height);
  if (rec) recordFrame(now);
  requestAnimationFrame(frame);
}

resize();
setSeed(URL_SEED || randomSeed());
music.show();
wakeToggle();
toast(matchMedia('(pointer: coarse)').matches ? 'tap for a gust and music · controls in the corner' : 'click for a gust and music · H for controls', 4000);
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
</html>
